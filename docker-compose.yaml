services:
  sonarqube:
    image: sonarqube:9.9-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=${SONAR_ES_BOOTSTRAP_CHECKS_DISABLE}
      - SONAR_JDBC_URL=${SONAR_JDBC_URL}
      - SONAR_JDBC_USERNAME=${SONAR_JDBC_USERNAME}
      - SONAR_JDBC_PASSWORD=${SONAR_JDBC_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - ./reports:/app/reports
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:13
    container_name: sonarqube_db
    environment:
      - POSTGRES_USER=${SONAR_JDBC_USERNAME}
      - POSTGRES_PASSWORD=${SONAR_JDBC_PASSWORD}
      - POSTGRES_DB=sonar
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_JDBC_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  semgrep:
    image: semgrep/semgrep:latest
    container_name: semgrep
    environment:
      - SEMGREP_APP_TOKEN=${SEMGREP_APP_TOKEN}
    volumes:
      - .:/src
    working_dir: /src
    command: semgrep scan --config auto --json --output reports/semgrep_report.json src/s

  sonarscanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: sonarscanner
    volumes:
      - ./src/BenchmarkJava/src/main/java/org/owasp/benchmark/testcode_OLD:/project
      - ./reports:/project/reports
    working_dir: /project
    stdin_open: true
    tty: true
    entrypoint: ["/bin/sh", "-c"]
    command: >
      echo "Waiting for SonarQube..." &&
      until curl -s http://sonarqube:9000/api/system/status | grep -q "UP"; do
        sleep 5;
      done &&
      echo "SonarQube is UP. Starting scanner..." &&
      sonar-scanner -Dsonar.projectKey=${SONAR_PROJECT_KEY} -Dsonar.sources=. -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.login=${SONAR_LOGIN}

  sonarqube-export:
    image: curlimages/curl:latest
    container_name: sonarqube-export
    depends_on:
      - sonarqube
    volumes:
      - ./reports:/reports
    environment:
      SONAR_LOGIN: ${SONAR_LOGIN}
      SONAR_HOST_URL: ${SONAR_HOST_URL}
      SONAR_PROJECT_KEY: ${SONAR_PROJECT_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      echo 'Exporting SonarQube issues to JSON...' &&
      curl -v -u ${SONAR_LOGIN}: "${SONAR_HOST_URL}/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&types=VULNERABILITY,BUG,CODE_SMELL&ps=500" -o /reports/sonarqube_report.json &&
      echo 'Export complete. Contents of report:' &&
      cat /reports/sonarqube_report.json

  pre-commit:
    image: python:3.9
    container_name: pre-commit
    volumes:
      - .:/repo
      - ./reports:/repo/reports
    working_dir: /repo
    entrypoint: ["/bin/sh", "-c"]
    command: >
      echo "Running pre-commit hooks..." &&
      pre-commit run --all-files &&
      echo "Pre-commit checks completed."

volumes:
  sonarqube_data:
  sonarqube_extensions:
  db_data: